<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8a6d3b">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Cassini overlay – Pas-de-Calais</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  #panel {
    position: absolute; left: 10px; right: 10px; bottom: 18px; z-index: 1000;
    max-width: 440px; margin: 0 auto; padding: 10px 12px;
    background: rgba(250, 246, 235, .95); border: 1px solid #b9a984; border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,.3); font-size: 14px; color: #3b3222;
  }
  #panel .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; flex-wrap: wrap; }
  #opacity { flex: 1; min-width: 120px; }
  button, select { font: inherit; padding: 6px 10px; border: 1px solid #b9a984; border-radius: 6px; background: #fff; color: inherit; }
  #status { font-size: 12px; color: #7a6a45; }
  #keyrow input, #gorow input { flex: 1; min-width: 140px; font: inherit; padding: 6px; border: 1px solid #b9a984; border-radius: 6px; }
  details summary { cursor: pointer; font-size: 12px; color: #7a6a45; padding: 4px 0; }
  #trip.rec { background: #c0392b; color: #fff; border-color: #c0392b; }
  .sheet { position: absolute; inset: 0; z-index: 2000; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
  .sheet[hidden] { display: none; }
  .sheet > div { background: #faf6eb; color: #3b3222; width: 100%; max-width: 480px; max-height: 85%; overflow: auto;
    border-radius: 14px 14px 0 0; padding: 14px; box-sizing: border-box; font-size: 14px; }
  .sheet h2 { font-size: 16px; margin: 0 0 8px; }
  .sheet h3 { font-size: 13px; margin: 14px 0 4px; color: #7a6a45; text-transform: uppercase; letter-spacing: .04em; }
  .sheet input[type=text] { width: 100%; box-sizing: border-box; font: inherit; padding: 8px; border: 1px solid #b9a984; border-radius: 6px; }
  .sheet .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  #fprev { max-width: 100%; max-height: 220px; border-radius: 8px; display: block; margin: 8px 0; }
  .item { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid #e2d6b5; }
  .item .grow { flex: 1; min-width: 0; }
  .item small { color: #7a6a45; display: block; }
  .item img { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; }
  .primary { background: #8a6d3b; color: #fff; border-color: #8a6d3b; }
  .findpin { width: 18px; height: 18px; border-radius: 50%; background: #e0a800; border: 3px solid #fff; box-shadow: 0 0 0 1px #6b5200, 0 1px 4px rgba(0,0,0,.5); }
  #sat.on, #lidar.on, #roman.on, #clues.on { background: #8a6d3b; color: #fff; border-color: #8a6d3b; }
  .clue { white-space: nowrap; font: 600 11px system-ui, sans-serif; color: #111; background: rgba(255,255,255,.92);
    border: 2px solid #555; border-radius: 10px; padding: 1px 6px; transform: translate(-50%, -50%); display: inline-block; }
  #sites.on { background: #8a6d3b; color: #fff; border-color: #8a6d3b; }
  #legend { font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 6px 0; }
  #legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; border: 1px solid #fff; box-shadow: 0 0 0 1px #555; }
  .pop a { color: #1a5fb4; }
  .pop img { width: 200px; max-width: 100%; border-radius: 6px; display: block; margin-bottom: 6px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <div class="row">
    <span>Today</span>
    <input id="opacity" type="range" min="0" max="100" value="65" aria-label="Cassini opacity">
    <span>Cassini</span>
  </div>
  <div class="row">
    <button id="locate">My position</button>
    <button id="trip">Start trip</button>
    <button id="find">Add find</button>
    <button id="hist">History</button>
    <button id="sites">Historic sites</button>
    <button id="clues">Name clues</button>
    <button id="sat">Satellite</button>
    <button id="lidar">LiDAR</button>
    <button id="roman">Roman roads</button>
    <button id="install" hidden>Install app</button>
  </div>
  <div class="row" id="gorow">
    <input id="goname" placeholder="Go to: town, address or 45.76, 4.83" enterkeyhint="go">
    <button id="go">Go</button>
  </div>
  <div id="status">Loading Cassini layer…</div>
  <details>
    <summary>Places &amp; map options · v15</summary>
    <div class="row">
      <button data-ll="50.3422,1.9978">Caumont</button>
      <button data-ll="50.335,2.0492">Le Quesnoy-en-Artois</button>
      <button data-ll="50.4472,2.0556">Fressin</button>
      <button data-ll="45.7578,4.8320">Lyon</button>
      <select id="base" aria-label="Base map"></select>
    </div>
    <div class="row"><label><input type="checkbox" id="cad"> Cadastre (plot boundaries)</label></div>
    <div id="legend"></div>
    <small>Missing a site? Long-press the map at its location to add it yourself.</small>
    <div class="row"><button id="update">Update app</button><small id="ver">Version 15</small></div>
    <div class="row" id="keyrow">
      <input id="gkey" placeholder="Google Maps API key (optional)">
      <button id="gload">Use</button>
    </div>
  </details>
</div>

<!-- New find -->
<div class="sheet" id="findSheet" hidden><div>
  <h2>New find</h2>
  <div id="fwhere"></div>
  <img id="fprev" hidden alt="Photo of the find">
  <div class="row">
    <button id="fphoto">Take / choose photo</button>
    <input id="photo" type="file" accept="image/*" hidden>
  </div>
  <input id="fnote" type="text" placeholder="What is it? (coin, button, buckle…)">
  <div class="row">
    <button id="fsave" class="primary">Save find</button>
    <button id="fcancel">Cancel</button>
  </div>
</div></div>

<!-- My own place -->
<div class="sheet" id="placeSheet" hidden><div>
  <h2>Add a place here</h2>
  <input id="pname" type="text" placeholder="Name (e.g. old castle of Caumont)">
  <div class="row"><select id="pcat" aria-label="Type of place"></select></div>
  <div class="row">
    <button id="psave" class="primary">Save place</button>
    <button id="pcancel">Cancel</button>
  </div>
</div></div>

<!-- History -->
<div class="sheet" id="histSheet" hidden><div>
  <div class="row" style="justify-content:space-between;margin-top:0">
    <h2 style="margin:0">Trips &amp; finds</h2>
    <button id="hclose">Close</button>
  </div>
  <h3>Trips</h3><div id="tripList"></div>
  <h3>Finds</h3><div id="findList"></div>
  <div class="row"><button id="export">Export backup file</button></div>
  <small>Everything is stored on this phone only. Export a backup from time to time.</small>
</div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

const map = L.map('map', { zoomControl: false }).setView([50.39, 2.03], 12);
L.control.zoom({ position: 'topright' }).addTo(map);
L.control.scale({ imperial: false }).addTo(map);

/* ---------- Base maps ---------- */
const geopf = (layer, format) =>
  'https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&STYLE=normal&TILEMATRIXSET=PM' +
  '&LAYER=' + layer + '&FORMAT=' + format + '&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}';

const bases = {
  'OpenStreetMap': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    { maxZoom: 19, attribution: '© OpenStreetMap contributors' }),
  'Satellite': L.tileLayer(geopf('ORTHOIMAGERY.ORTHOPHOTOS', 'image/jpeg'),
    { maxZoom: 19, attribution: '© IGN' }),
  'IGN plan': L.tileLayer(geopf('GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2', 'image/png'),
    { maxZoom: 19, attribution: '© IGN' })
};
let currentBase = null;
function refreshBaseList(selected) {
  $('base').innerHTML = Object.keys(bases).map(n => '<option>' + n + '</option>').join('');
  if (selected) $('base').value = selected;
}
function setBase(name) {
  if (currentBase) map.removeLayer(currentBase);
  currentBase = bases[name].addTo(map);
  if (currentBase.bringToBack) currentBase.bringToBack();
  $('base').value = name;
  $('sat').classList.toggle('on', name === 'Satellite');
  $('lidar').classList.toggle('on', name === 'LiDAR relief');
}
let prevBase = 'OpenStreetMap';
function toggleBase(name) {
  const now = $('base').value;
  if (now === name) return setBase(prevBase);
  if (now !== 'Satellite' && now !== 'LiDAR relief') prevBase = now;
  setBase(name);
  if (+$('opacity').value > 40) $('status').textContent = name + ' on – slide towards "Today" to see it through the Cassini map.';
}
$('sat').onclick = () => toggleBase('Satellite');

/* LiDAR relief (IGN shaded ground model, vegetation removed): shows banks, ditches, mottes, old tracks. */
const lidarUrl = (layer, style) =>
  'https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&TILEMATRIXSET=PM&FORMAT=image/png' +
  '&LAYER=' + layer + '&STYLE=' + encodeURIComponent(style) + '&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}';
const lidarCandidates = [
  ['IGNF_LIDAR-HD_MNT_ELEVATION.ELEVATIONGRIDCOVERAGE.SHADOW', 'normal', 'LiDAR HD', 18],
  ['IGNF_LIDAR-HD_MNT_ELEVATION.ELEVATIONGRIDCOVERAGE.SHADOW', 'estompage_grayscale', 'LiDAR HD', 18],
  ['ELEVATION.ELEVATIONGRIDCOVERAGE.SHADOW', 'estompage_grayscale', 'standard relief (LiDAR HD not available here)', 15],
  ['ELEVATION.ELEVATIONGRIDCOVERAGE.SHADOW', 'normal', 'standard relief (LiDAR HD not available here)', 15]
];
function lidarProbe(i) {
  if (i >= lidarCandidates.length) { $('status').textContent = 'LiDAR relief is not available right now.'; return; }
  const [layer, style, label, maxNative] = lidarCandidates[i], c = map.getCenter(), z = 14, n = Math.pow(2, z);
  const x = Math.floor((c.lng + 180) / 360 * n), r = c.lat * Math.PI / 180;
  const y = Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n);
  const img = new Image();
  img.onload = () => {
    bases['LiDAR relief'] = L.tileLayer(lidarUrl(layer, style), { maxNativeZoom: maxNative, maxZoom: 19, attribution: 'Relief © IGN' });
    refreshBaseList($('base').value);
    toggleBase('LiDAR relief');
    $('status').textContent = 'Relief source: ' + label + '. Slide towards "Today" to see it through the Cassini map.';
  };
  img.onerror = () => lidarProbe(i + 1);
  img.src = lidarUrl(layer, style).replace('{z}', z).replace('{x}', x).replace('{y}', y);
}
$('lidar').onclick = () => {
  if (bases['LiDAR relief']) return toggleBase('LiDAR relief');
  $('status').textContent = 'Loading LiDAR relief…'; lidarProbe(0);
};

/* ---------- Cassini overlay (IGN Géoplateforme) ---------- */
// The technical layer name has changed over the years, so probe the known variants.
const candidates = [
  ['BNF-IGNF_GEOGRAPHICALGRIDSYSTEMS.CASSINI', 'image/png'],
  ['BNF-IGNF_GEOGRAPHICALGRIDSYSTEMS.CASSINI', 'image/jpeg'],
  ['GEOGRAPHICALGRIDSYSTEMS.CASSINI', 'image/png'],
  ['GEOGRAPHICALGRIDSYSTEMS.CASSINI', 'image/jpeg']
];
let cassini = null;
function probe(i) {
  if (i >= candidates.length) {
    $('status').textContent = 'Cassini layer not found on data.geopf.fr – the layer name needs updating.';
    return;
  }
  const [layer, format] = candidates[i];
  // Tile covering the Hesdin area at zoom 12
  const url = geopf(layer, format).replace('{z}', 12).replace('{x}', 2071).replace('{y}', 1382);
  const img = new Image();
  img.onload = () => {
    cassini = L.tileLayer(geopf(layer, format), {
      maxNativeZoom: 15, maxZoom: 19, opacity: $('opacity').value / 100,
      attribution: 'Carte de Cassini © IGN / BnF'
    }).addTo(map);
    $('status').textContent = 'Cassini map (18th c.) over today\'s map – drag the slider to compare.';
  };
  img.onerror = () => probe(i + 1);
  img.src = url;
}
probe(0);
$('opacity').oninput = e => { if (cassini) cassini.setOpacity(e.target.value / 100); };

/* ---------- Navigation ---------- */
document.querySelectorAll('button[data-ll]').forEach(b => {
  b.onclick = () => map.setView(b.dataset.ll.split(',').map(Number), 14);
});
// Live position: blue dot + accuracy circle, updated as you move.
let me = null, acc = null, follow = false, tracking = false;
$('locate').onclick = () => {
  follow = true;                       // re-centre on me; dragging the map stops following
  if (!tracking) {
    tracking = true;
    map.locate({ watch: true, enableHighAccuracy: true, maximumAge: 5000 });
    $('status').textContent = 'Looking for your position…';
  } else if (me) map.setView(me.getLatLng(), Math.max(map.getZoom(), 15));
};
map.on('dragstart', () => { follow = false; });
map.on('locationfound', e => {
  if (!me) {
    acc = L.circle(e.latlng, { radius: e.accuracy, color: '#1a73e8', weight: 1, fillOpacity: .12 }).addTo(map);
    me = L.circleMarker(e.latlng, { radius: 8, color: '#fff', weight: 3, fillColor: '#1a73e8', fillOpacity: 1 }).addTo(map);
    map.setView(e.latlng, Math.max(map.getZoom(), 15));
  } else {
    me.setLatLng(e.latlng); acc.setLatLng(e.latlng).setRadius(e.accuracy);
    if (follow) map.panTo(e.latlng);
  }
  me.bringToFront();
  $('status').textContent = 'Your position: blue dot (± ' + Math.round(e.accuracy) + ' m).';
});
map.on('locationerror', () => {
  tracking = false; map.stopLocate();
  $('status').textContent = 'Position unavailable – allow location for this app in Chrome and switch GPS on.';
});

/* ---------- Field log: trips and finds, stored on the phone (IndexedDB) ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = t => new Date(t).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
const fmtKm = m => m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(2) + ' km';

const dbReady = new Promise((ok, ko) => {
  const r = indexedDB.open('cassini-field', 2);
  r.onupgradeneeded = () => {
    for (const s of ['trips', 'finds', 'places'])
      if (!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s, { keyPath: 'id' });
  };
  r.onsuccess = () => ok(r.result);
  r.onerror = () => ko(r.error);
});
const idb = (name, mode, fn) => dbReady.then(d => new Promise((ok, ko) => {
  const tx = d.transaction(name, mode), rq = fn(tx.objectStore(name));
  tx.oncomplete = () => ok(rq && rq.result);
  tx.onerror = tx.onabort = () => ko(tx.error);
}));
const dbPut = (s, v) => idb(s, 'readwrite', o => o.put(v));
const dbAll = s => idb(s, 'readonly', o => o.getAll());
const dbDel = (s, id) => idb(s, 'readwrite', o => o.delete(id));
const dbFail = () => { $('status').textContent = 'Could not save on this phone – storage unavailable or full.'; };

const tripsLayer = L.layerGroup().addTo(map), findsLayer = L.layerGroup().addTo(map);
let trips = [], finds = [], cur = null, curLine = null, wake = null, unsaved = 0;

function drawAll() {
  tripsLayer.clearLayers(); findsLayer.clearLayers();
  trips.forEach(t => {
    if (cur && t.id === cur.id) return;
    if (t.points.length > 1) L.polyline(t.points.map(p => [p[0], p[1]]), { color: '#7b3f00', weight: 3, opacity: .75 }).addTo(tripsLayer);
  });
  finds.forEach(f => {
    const m = L.marker([f.lat, f.lng], { icon: L.divIcon({ className: '', html: '<div class="findpin"></div>', iconSize: [24, 24], iconAnchor: [12, 12] }) }).addTo(findsLayer);
    m.bindPopup(() => {
      const d = document.createElement('div'); d.className = 'pop';
      d.innerHTML = (f.photo ? '<img src="' + f.photo + '" alt="">' : '') +
        '<b>' + esc(f.note || 'Find') + '</b><br>' + fmtDate(f.date) + '<br><small>' + f.lat.toFixed(5) + ', ' + f.lng.toFixed(5) + '</small>';
      return d;
    });
    f._marker = m;
  });
}
async function loadLog() {
  try {
    trips = await dbAll('trips'); finds = await dbAll('finds');
    // A trip left open (app closed while recording) is closed at its last recorded point.
    for (const t of trips) if (!t.end) { t.end = t.points.length ? t.points[t.points.length - 1][2] : t.start; await dbPut('trips', t); }
    drawAll();
  } catch (e) { dbFail(); }
}
loadLog();

/* ----- Trip recording ----- */
async function keepAwake() {
  try { if ('wakeLock' in navigator && cur) wake = await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') keepAwake();
  else if (cur) dbPut('trips', cur).catch(dbFail);
});
function tripLabel() {
  $('trip').textContent = cur ? 'Stop trip · ' + fmtKm(cur.dist) : 'Start trip';
  $('trip').classList.toggle('rec', !!cur);
}
$('trip').onclick = async () => {
  if (!cur) {
    cur = { id: Date.now(), start: Date.now(), end: null, points: [], dist: 0 };
    trips.push(cur);
    curLine = L.polyline([], { color: '#c0392b', weight: 4 }).addTo(map);
    dbPut('trips', cur).catch(dbFail);
    keepAwake();
    $('locate').click();               // make sure GPS is on and the map follows
    $('status').textContent = 'Recording trip – keep the app open and the screen on.';
  } else {
    cur.end = Date.now();
    const done = cur; cur = null;
    if (wake) { try { wake.release(); } catch (e) {} wake = null; }
    map.removeLayer(curLine); curLine = null;
    try { await dbPut('trips', done); } catch (e) { dbFail(); }
    drawAll();
    $('status').textContent = 'Trip saved: ' + fmtKm(done.dist) + ', ' + finds.filter(f => f.tripId === done.id).length + ' find(s).';
  }
  tripLabel();
};
map.on('locationfound', e => {
  if (!cur || e.accuracy > 40) return;             // ignore poor fixes
  const last = cur.points[cur.points.length - 1];
  const step = last ? map.distance([last[0], last[1]], e.latlng) : Infinity;
  if (last && step < 4) return;                    // ignore jitter while standing still
  if (last) cur.dist += step;
  cur.points.push([e.latlng.lat, e.latlng.lng, Date.now()]);
  curLine.addLatLng(e.latlng);
  tripLabel();
  if (++unsaved >= 5) { unsaved = 0; dbPut('trips', cur).catch(dbFail); }
});

/* ----- Finds ----- */
let draft = null;
$('find').onclick = () => {
  const gps = me ? me.getLatLng() : null, c = gps || map.getCenter();
  draft = { lat: c.lat, lng: c.lng, photo: null };
  $('fwhere').textContent = gps
    ? 'Location: your GPS position (' + c.lat.toFixed(5) + ', ' + c.lng.toFixed(5) + ')'
    : 'No GPS position yet – the find will be placed at the centre of the map.';
  $('fprev').hidden = true; $('fnote').value = ''; $('photo').value = '';
  $('findSheet').hidden = false;
};
$('fphoto').onclick = () => $('photo').click();
$('photo').onchange = e => {
  const file = e.target.files[0]; if (!file) return;
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {                             // shrink to keep storage small
    const k = Math.min(1, 1280 / Math.max(img.width, img.height));
    const cv = document.createElement('canvas');
    cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    draft.photo = cv.toDataURL('image/jpeg', .8);
    $('fprev').src = draft.photo; $('fprev').hidden = false;
    URL.revokeObjectURL(url);
  };
  img.onerror = () => { URL.revokeObjectURL(url); $('fwhere').textContent = 'That photo could not be read – try again.'; };
  img.src = url;
};
$('fcancel').onclick = () => { $('findSheet').hidden = true; draft = null; };
$('fsave').onclick = async () => {
  const f = { id: Date.now(), date: Date.now(), tripId: cur ? cur.id : null,
              lat: draft.lat, lng: draft.lng, note: $('fnote').value.trim(), photo: draft.photo };
  try {
    await dbPut('finds', f);
    finds.push(f); drawAll();
    $('status').textContent = 'Find saved.';
  } catch (e) { dbFail(); }
  $('findSheet').hidden = true; draft = null;
};

/* ----- History ----- */
function armDelete(btn, fn) {                      // two taps to delete
  btn.onclick = () => {
    if (btn.dataset.armed) return fn();
    btn.dataset.armed = 1; btn.textContent = 'Confirm';
    setTimeout(() => { delete btn.dataset.armed; btn.textContent = 'Delete'; }, 3000);
  };
}
function renderHistory() {
  const tl = $('tripList'), fl = $('findList'); tl.innerHTML = ''; fl.innerHTML = '';
  const ts = trips.slice().sort((a, b) => b.start - a.start);
  if (!ts.length) tl.innerHTML = '<small>No trips yet. Tap "Start trip" when you begin detecting.</small>';
  ts.forEach(t => {
    const n = finds.filter(f => f.tripId === t.id).length;
    const mins = Math.round(((t.end || Date.now()) - t.start) / 60000);
    const d = document.createElement('div'); d.className = 'item';
    d.innerHTML = '<div class="grow"><b>' + fmtDate(t.start) + '</b>' + (t.end ? '' : ' (recording)') +
      '<small>' + fmtKm(t.dist) + ' · ' + mins + ' min · ' + n + ' find(s)</small></div>' +
      '<button class="show">Show</button>' + (t.end ? '<button class="del">Delete</button>' : '');
    d.querySelector('.show').onclick = () => {
      $('histSheet').hidden = true; follow = false;
      if (t.points.length) map.fitBounds(L.latLngBounds(t.points.map(p => [p[0], p[1]])).pad(.2), { maxZoom: 17 });
    };
    if (t.end) armDelete(d.querySelector('.del'), async () => {
      try { await dbDel('trips', t.id); trips = trips.filter(x => x.id !== t.id); drawAll(); renderHistory(); } catch (e) { dbFail(); }
    });
    tl.appendChild(d);
  });
  const fs = finds.slice().sort((a, b) => b.date - a.date);
  if (!fs.length) fl.innerHTML = '<small>No finds yet. Tap "Add find" where you dig something up.</small>';
  fs.forEach(f => {
    const d = document.createElement('div'); d.className = 'item';
    d.innerHTML = (f.photo ? '<img src="' + f.photo + '" alt="">' : '') +
      '<div class="grow"><b>' + esc(f.note || 'Find') + '</b><small>' + fmtDate(f.date) + '</small></div>' +
      '<button class="show">Show</button><button class="del">Delete</button>';
    d.querySelector('.show').onclick = () => {
      $('histSheet').hidden = true; follow = false;
      map.setView([f.lat, f.lng], Math.max(map.getZoom(), 16));
      if (f._marker) f._marker.openPopup();
    };
    armDelete(d.querySelector('.del'), async () => {
      try { await dbDel('finds', f.id); finds = finds.filter(x => x.id !== f.id); drawAll(); renderHistory(); } catch (e) { dbFail(); }
    });
    fl.appendChild(d);
  });
}

/* ---------- Known historic sites (OpenStreetMap data, loaded for the visible area) ---------- */
const CATS = {
  castle: { label: 'Castles, mottes & manors', color: '#8e44ad' },
  battle: { label: 'Battles & sieges (all periods)', color: '#c0392b' },
  milit:  { label: 'Forts, camps, bunkers & trenches', color: '#566573' },
  arch:   { label: 'Archaeological sites',     color: '#d35400' },
  other:  { label: 'Ruins, towers, walls, abbeys', color: '#16a085' }
};
$('legend').innerHTML = Object.values(CATS).map(c => '<span><i style="background:' + c.color + '"></i>' + c.label + '</span>').join('');
function siteCat(t) {
  const h = t.historic;
  if (h === 'castle' || h === 'manor' || h === 'castle_wall') return 'castle';
  if (h === 'battlefield') return 'battle';
  if (h === 'fort' || h === 'fortification' || h === 'bunker' || t.military || t['abandoned:military']) return 'milit';
  if (h === 'archaeological_site' || h === 'earthworks') return 'arch';
  return 'other';
}
const pretty = s => String(s).replace(/[_;]/g, ' ');
const SITE_MIN_ZOOM = 11;
const sitesLayer = L.layerGroup(), siteSeen = new Set();
let sitesOn = false, sitesLoaded = null, sitesBusy = false, sitesTimer = null;

function addSite(el) {
  const key = el.type + el.id; if (siteSeen.has(key)) return;
  const lat = el.lat != null ? el.lat : el.center && el.center.lat, lon = el.lon != null ? el.lon : el.center && el.center.lon;
  if (lat == null || lon == null) return;
  siteSeen.add(key);
  const t = el.tags || {}, cat = CATS[siteCat(t)];
  const kind = [t.historic || t.military || t['abandoned:military'], t.castle_type, t.site_type, t.fortification_type, t.bunker_type, t.ruins].filter(Boolean).map(pretty);
  const period = [t['historic:civilization'], t['historic:period'], t.start_date].filter(Boolean).map(pretty);
  let link = '';
  if (t.wikipedia && t.wikipedia.indexOf(':') > 0) {
    const i = t.wikipedia.indexOf(':');
    link = 'https://' + encodeURIComponent(t.wikipedia.slice(0, i)) + '.wikipedia.org/wiki/' + encodeURIComponent(t.wikipedia.slice(i + 1).replace(/ /g, '_'));
  } else if (/^Q\d+$/.test(t.wikidata || '')) link = 'https://www.wikidata.org/wiki/' + t.wikidata;
  L.circleMarker([lat, lon], { radius: 7, color: '#fff', weight: 2, fillColor: cat.color, fillOpacity: .95 })
    .bindPopup('<div class="pop"><b>' + esc(t.name || t['name:fr'] || cat.label) + '</b><br>' +
      esc([...new Set(kind)].join(' · ')) + (period.length ? '<br>' + esc(period.join(' · ')) : '') +
      (t.description ? '<br><small>' + esc(t.description) + '</small>' : '') +
      (link ? '<br><a href="' + link + '" target="_blank" rel="noopener">More information</a>' : '') + '</div>')
    .addTo(sitesLayer);
}
async function loadSites() {
  if (!sitesOn || sitesBusy) return;
  if (map.getZoom() < SITE_MIN_ZOOM) { $('status').textContent = 'Zoom in to load historic sites.'; return; }
  const b = map.getBounds();
  if (sitesLoaded && sitesLoaded.contains(b)) return;
  const q = b.pad(.3), box = [q.getSouth(), q.getWest(), q.getNorth(), q.getEast()].map(n => n.toFixed(4)).join(',');
  const query = '[out:json][timeout:25];(' +
    'nwr["historic"~"^(castle|manor|castle_wall|battlefield|archaeological_site|earthworks|fort|fortification|bunker|ruins|tower|city_gate|citywalls|monastery)$"](' + box + ');' +
    'nwr["military"~"^(bunker|trench)$"](' + box + ');' +
    'nwr["abandoned:military"](' + box + ');' +
    ');out center tags 600;';
  sitesBusy = true; $('status').textContent = 'Loading historic sites…';
  const [places, battles, wiki] = await Promise.all([fetchPlaces(query), fetchBattles(q), fetchWiki()]);
  sitesBusy = false;
  if (!places && !battles && !wiki) { $('status').textContent = 'Historic sites could not be loaded – check the connection and try again.'; return; }
  (places || []).forEach(addSite);
  (battles || []).forEach(addBattle);
  (wiki || []).forEach(addWiki);              // last, so it only fills gaps left by the other two
  if (places && battles && wiki) sitesLoaded = map.getBounds();        // retry next time if one source failed
  const n = sitesLayer.getLayers().length;
  $('status').textContent = n + ' known historic site(s) loaded – tap a dot for details.' +
    (!places ? ' (OpenStreetMap source failed.)' : '') + (!battles ? ' (Wikidata source failed.)' : '') + (!wiki ? ' (Wikipedia source failed.)' : '') +
    ((places || []).length >= 600 ? ' Zoom in to see them all.' : '');
}
async function fetchPlaces(query) {              // OpenStreetMap: castles, manors, forts, bunkers, trenches, ruins…
  for (const host of ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter']) {
    try {
      const r = await fetch(host, { method: 'POST', body: 'data=' + encodeURIComponent(query),
                                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
      if (!r.ok) continue;
      const d = await r.json();
      if (Array.isArray(d.elements)) return d.elements;
    } catch (e) {}
  }
  return null;
}
async function fetchBattles(q) {                 // Wikidata: battles and sieges of every period (medieval, Spanish wars, WW1, WW2…)
  const sparql = 'SELECT ?item ?itemLabel ?loc ?date ?start ?warLabel ?article WHERE {' +
    'SERVICE wikibase:box { ?item wdt:P625 ?loc. bd:serviceParam wikibase:cornerSouthWest "Point(' + q.getWest().toFixed(4) + ' ' + q.getSouth().toFixed(4) + ')"^^geo:wktLiteral;' +
    ' wikibase:cornerNorthEast "Point(' + q.getEast().toFixed(4) + ' ' + q.getNorth().toFixed(4) + ')"^^geo:wktLiteral. }' +
    ' VALUES ?cls { wd:Q178561 wd:Q188055 } ?item wdt:P31/wdt:P279* ?cls.' +
    ' OPTIONAL { ?item wdt:P585 ?date } OPTIONAL { ?item wdt:P580 ?start } OPTIONAL { ?item wdt:P361 ?war }' +
    ' OPTIONAL { ?article schema:about ?item; schema:isPartOf <https://fr.wikipedia.org/> }' +
    ' SERVICE wikibase:label { bd:serviceParam wikibase:language "en,fr" } } LIMIT 400';
  try {
    const r = await fetch('https://query.wikidata.org/sparql?format=json&query=' + encodeURIComponent(sparql),
                          { headers: { Accept: 'application/sparql-results+json' } });
    if (!r.ok) return null;
    const d = await r.json();
    return d.results && Array.isArray(d.results.bindings) ? d.results.bindings : null;
  } catch (e) { return null; }
}
// French Wikipedia articles located near the centre of the map whose title names a battle, castle, camp, fort…
const WIKI_RULES = [
  ['battle', /bataille|si[èe]ge d|combat d|offensive/i],
  ['castle', /ch[âa]teau|manoir|motte|donjon|seigneurie/i],
  ['milit',  /\bcamp\b|\bfort\b|forteresse|citadelle|blockhaus|bunker|\bV[12]\b|tranch[ée]e|base de lancement|a[ée]rodrome|batterie|ligne /i],
  ['arch',   /oppidum|tumulus|gallo-romain|villa romaine|site arch[ée]ologique|voie romaine|n[ée]cropole/i],
  ['other',  /abbaye|prieur[ée]|commanderie|rempart|ruines|chartreuse/i]
];
async function fetchWiki() {
  const c = map.getCenter();
  try {
    const r = await fetch('https://fr.wikipedia.org/w/api.php?action=query&list=geosearch&gscoord=' + c.lat.toFixed(4) + '%7C' + c.lng.toFixed(4) +
                          '&gsradius=10000&gslimit=500&format=json&origin=*');
    if (!r.ok) return null;
    const d = await r.json();
    return d.query && Array.isArray(d.query.geosearch) ? d.query.geosearch : null;
  } catch (e) { return null; }
}
function addWiki(a) {
  const rule = WIKI_RULES.find(r => r[1].test(a.title || '')); if (!rule) return;
  const key = 'wiki' + a.pageid; if (siteSeen.has(key)) return;
  // skip if a dot of another source already sits within ~150 m with the same category colour
  const cat = CATS[rule[0]], here = L.latLng(a.lat, a.lon);
  if (sitesLayer.getLayers().some(l => l.options.fillColor === cat.color && map.distance(l.getLatLng(), here) < 150)) return;
  siteSeen.add(key);
  L.circleMarker(here, { radius: rule[0] === 'battle' ? 8 : 7, color: '#fff', weight: 2, fillColor: cat.color, fillOpacity: .95 })
    .bindPopup('<div class="pop"><b>' + esc(a.title) + '</b><br>' + esc(cat.label) +
      '<br><a href="https://fr.wikipedia.org/?curid=' + encodeURIComponent(a.pageid) + '" target="_blank" rel="noopener">Wikipedia</a></div>')
    .addTo(sitesLayer);
}

/* ----- My own places (long-press the map) ----- */

let myPlaces = [], placeAt = null;
$('pcat').innerHTML = Object.keys(CATS).map(k => '<option value="' + k + '">' + CATS[k].label + '</option>').join('');

        armDelete(d.querySelector('button'), async () => {

/* ---------- Cadastre overlay (IGN Parcellaire Express) ---------- */
const cadUrl = (layer, style) =>
  'https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&TILEMATRIXSET=PM&FORMAT=image/png' +
  '&LAYER=' + layer + '&STYLE=' + encodeURIComponent(style) + '&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}';
const cadCandidates = [['CADASTRALPARCELS.PARCELLAIRE_EXPRESS', 'PCI vecteur'], ['CADASTRALPARCELS.PARCELLAIRE_EXPRESS', 'normal'],
                       ['CADASTRALPARCELS.PARCELS', 'normal'], ['CADASTRALPARCELS.PARCELS', 'bdparcellaire']];
let cadLayer = null;
function cadProbe(i) {
  if (i >= cadCandidates.length) { $('status').textContent = 'Cadastre layer not available right now.'; $('cad').checked = false; return; }
  const [layer, style] = cadCandidates[i], img = new Image();
  img.onload = () => {
    cadLayer = L.tileLayer(cadUrl(layer, style), { maxNativeZoom: 19, maxZoom: 19, minZoom: 13, opacity: .9, attribution: 'Cadastre © IGN / DGFiP' });
    if ($('cad').checked) showCad();
  };
  img.onerror = () => cadProbe(i + 1);
  img.src = cadUrl(layer, style).replace('{z}', 15).replace('{x}', 16571).replace('{y}', 11049);
}
function showCad() {
  cadLayer.addTo(map);
  $('status').textContent = map.getZoom() < 13 ? 'Cadastre on – zoom in closer to see the plots.' : 'Cadastre on.';
}
$('cad').onchange = () => {
  if (!$('cad').checked) { if (cadLayer) map.removeLayer(cadLayer); return; }
  if (cadLayer) showCad(); else cadProbe(0);
};

/* ---------- Place-name clues: lieux-dits whose name hints at history ---------- */
// Tested on the name in lower case without accents.
const CLUES = [
  { color: '#6c3483', why: 'Templars / Hospitallers: land of a military order',        re: /\b(templ\w*|commanderie|hospital\w*|hopital)\b/ },
  { color: '#6c3483', why: 'Religious house, chapel or leper hospital, often vanished', re: /\b(abbaye|abbe|prieure|moines?|moutier|moustier|couvent|cloitre|chapelle|ermitage|maladrerie|ladrerie|chartreuse|eglise)\b/ },
  { color: '#8e44ad', why: 'Castle, motte or fortification',                              re: /\b(chateau\w*|chatel\w*|catel\w*|castel\w*|motte\w*|donjon|tours?|forts?|fortins?|forteresse|ferte|plessis|bastille|redoute|remparts?|fosses|garenne|manoir|fief|seigneur\w*)\b/ },
  { color: '#c0392b', why: 'Battle, army camp or soldiers',                               re: /\b(batailles?|camps?|guerre|combat|anglais|espagnols?|bourguignons?|sarrasins?|prussiens?|cosaques?|soldats?|canons?|tranchees?|armee|gendarmes?)\b/ },
  { color: '#7b241c', why: 'Gallows, justice or burial place',                            re: /\b(justice|gibet|potence|fourches|pendus?|tombes?|tombelles?|tombeau|cimetiere|ossuaire|morts?)\b/ },
  { color: '#d35400', why: 'Roman road, ancient or lost settlement',                      re: /\b(chaussee|brunehaut|estrees?|romains?|cesar|tumulus|vieille ville|vieville|vieux|ancien\w*|mazures?|masures?|tuiler\w*|tresor|terres noires|pierres?)\b/ },
  { color: '#1f618d', why: 'Old mill, forge or workshop',                                 re: /\b(moulins?|forges?|verrerie|briqueterie|four a chaux|ferme detruite)\b/ }
];
const cluesLayer = L.layerGroup(), clueSeen = new Set();
let cluesOn = false, cluesLoaded = null, cluesBusy = false, cluesTimer = null;
const plain = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[-'’]/g, ' ');
function firstXY(c) { while (Array.isArray(c) && Array.isArray(c[0])) c = c[0]; return c; }
async function fetchNames(type, b) {
  const url = 'https://data.geopf.fr/wfs/ows?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature&TYPENAMES=' + type +
    '&OUTPUTFORMAT=application/json&SRSNAME=EPSG:4326&COUNT=5000&BBOX=' +
    [b.getSouth(), b.getWest(), b.getNorth(), b.getEast()].map(n => n.toFixed(5)).join(',') + ',urn:ogc:def:crs:EPSG::4326';
  try {
    const r = await fetch(url); if (!r.ok) return null;
    const d = await r.json(); return Array.isArray(d.features) ? d.features : null;
  } catch (e) { return null; }
}
function addClue(f) {
  const pr = f.properties || {}, name = pr.toponyme || pr.graphie_du_toponyme || pr.graphie || pr.nom;
  if (!name || !f.geometry) return;
  const rule = CLUES.find(c => c.re.test(plain(name))); if (!rule) return;
  let xy = firstXY(f.geometry.coordinates); if (!xy || xy.length < 2) return;
  let lon = xy[0], lat = xy[1]; if (lon > 20) { lon = xy[1]; lat = xy[0]; }   // some servers answer lat,lon
  const key = plain(name) + '|' + lat.toFixed(3) + '|' + lon.toFixed(3); if (clueSeen.has(key)) return;
  clueSeen.add(key);
  L.marker([lat, lon], { icon: L.divIcon({ className: '', iconSize: [0, 0], html: '<span class="clue" style="border-color:' + rule.color + '">' + esc(name) + '</span>' }) })
    .bindPopup('<div class="pop"><b>' + esc(name) + '</b><br>' + esc(rule.why) + '<br><small>A name is only a hint, not proof of a site.</small></div>')
    .addTo(cluesLayer);
}
async function loadClues() {
  if (!cluesOn || cluesBusy) return;
  if (map.getZoom() < 12) { $('status').textContent = 'Zoom in to load place-name clues.'; return; }
  const b = map.getBounds();
  if (cluesLoaded && cluesLoaded.contains(b)) return;
  const q = b.pad(.25);
  cluesBusy = true; $('status').textContent = 'Reading place names…';
  const res = await Promise.all([fetchNames('BDTOPO_V3:lieu_dit_non_habite', q), fetchNames('BDTOPO_V3:toponymie_lieux_nommes', q)]);
  cluesBusy = false;
  if (!res[0] && !res[1]) { $('status').textContent = 'Place names could not be loaded (IGN name service failed).'; return; }
  const total = (res[0] || []).length + (res[1] || []).length;
  res.forEach(a => (a || []).forEach(addClue));
  cluesLoaded = q;
  $('status').textContent = cluesLayer.getLayers().length + ' suggestive name(s) flagged out of ' + total + ' place names read – tap a label.';
}
$('clues').onclick = () => {
  cluesOn = !cluesOn; $('clues').classList.toggle('on', cluesOn);
  if (cluesOn) { cluesLayer.addTo(map); loadClues(); }
  else { map.removeLayer(cluesLayer); $('status').textContent = 'Name clues hidden.'; }
};
map.on('moveend', () => { clearTimeout(cluesTimer); cluesTimer = setTimeout(loadClues, 800); });

/* ---------- Go to any French commune (official geo.api.gouv.fr directory) ---------- */
async function goTo() {
  const name = $('goname').value.trim(); if (!name) return;
  const jump = (lat, lng, zoom, label) => { follow = false; map.setView([lat, lng], zoom); $('status').textContent = label; $('goname').blur(); };
  const m = /^\s*(-?\d+(?:[.,]\d+)?)\s*[,; ]\s*(-?\d+(?:[.,]\d+)?)\s*$/.exec(name);   // "lat, lon"
  if (m) {
    const lat = parseFloat(m[1].replace(',', '.')), lng = parseFloat(m[2].replace(',', '.'));
    if (Math.abs(lat) <= 90 && Math.abs(lng) <= 180) return jump(lat, lng, 16, 'Coordinates ' + lat.toFixed(5) + ', ' + lng.toFixed(5));
  }
  $('status').textContent = 'Searching…';
  try {                                             // addresses, hamlets, lieux-dits (OpenStreetMap search)
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=fr&q=' + encodeURIComponent(name));
    const d = r.ok ? await r.json() : [];
    if (d.length) return jump(+d[0].lat, +d[0].lon, 15, String(d[0].display_name || name).split(',').slice(0, 3).join(','));
  } catch (e) {}
  try {                                             // fallback: official list of communes
    const r = await fetch('https://geo.api.gouv.fr/communes?nom=' + encodeURIComponent(name) + '&fields=nom,centre,codeDepartement&boost=population&limit=1');
    const d = r.ok ? await r.json() : [];
    if (d.length && d[0].centre) { const c = d[0].centre.coordinates; return jump(c[1], c[0], 13, d[0].nom + ' (' + d[0].codeDepartement + ')'); }
    $('status').textContent = 'Nothing found for "' + name + '".';
  } catch (e) { $('status').textContent = 'Search failed – check the connection.'; }
}
$('go').onclick = goTo;
$('goname').onkeydown = e => { if (e.key === 'Enter') goTo(); };

/* ---------- Roman roads (OpenStreetMap: ways recorded as Roman, or named voie romaine / chaussée Brunehaut…) ---------- */
const romanLayer = L.layerGroup(), romanSeen = new Set();
let romanOn = false, romanLoaded = null, romanBusy = false, romanTimer = null;
function addRoman(el) {
  const key = el.type + el.id; if (romanSeen.has(key)) return;
  const parts = el.geometry ? [el.geometry] : (el.members || []).map(m => m.geometry).filter(Boolean);
  const lines = parts.map(g => g.filter(Boolean).map(pt => [pt.lat, pt.lon])).filter(l => l.length > 1);
  if (!lines.length) return;
  romanSeen.add(key);
  const t = el.tags || {}, sure = t.historic === 'roman_road' || t.roman_road === 'yes' || /roman/i.test(t['historic:civilization'] || '');
  L.polyline(lines, { color: '#b03a2e', weight: 5, opacity: .85, dashArray: sure ? null : '8 8' })
    .bindPopup('<div class="pop"><b>' + esc(t.name || 'Roman road') + '</b><br>' +
      (sure ? 'Recorded as a Roman road' : 'Named after a Roman road – course not confirmed') +
      (t.description ? '<br><small>' + esc(t.description) + '</small>' : '') + '</div>')
    .addTo(romanLayer);
}
/* Main source: Itiner-e research dataset (France extract shipped with the app as roman-roads-fr.json). */
let itiner = null, itinerTried = false;
const itinerLayer = L.layerGroup(), itinerCanvas = L.canvas({ padding: .3, tolerance: 8 });
async function loadItiner() {
  if (itinerTried) return; itinerTried = true;
  try {
    const r = await fetch('roman-roads-fr.json'); if (!r.ok) return;
    const d = await r.json(); if (!Array.isArray(d.roads)) return;
    d.roads.forEach(s => { s.b = L.latLngBounds(s.l); });
    itiner = d.roads;
  } catch (e) {}
}
function drawItiner() {
  itinerLayer.clearLayers();
  if (!itiner || !romanOn) return 0;
  const view = map.getBounds().pad(.2), vb = map.getBounds(); let n = 0, drawn = 0;
  const rect = L.bounds(L.point(vb.getWest(), vb.getSouth()), L.point(vb.getEast(), vb.getNorth()));
  const crosses = l => {                         // does the line really pass through the screen?
    for (let i = 1; i < l.length; i++)
      if (L.LineUtil.clipSegment(L.point(l[i - 1][1], l[i - 1][0]), L.point(l[i][1], l[i][0]), rect, false, false)) return true;
    return false;
  };
  for (const s of itiner) {
    if (!view.intersects(s.b)) continue;
    if (crosses(s.l)) n++;
    const main = /main/i.test(s.t);
    const dash = /certain/i.test(s.c) ? null : /hypoth/i.test(s.c) ? '2 9' : '14 7';
    const note = /certain/i.test(s.c) ? 'Course located precisely' : /hypoth/i.test(s.c) ? 'Road assumed to exist – course is a guess'
               : 'Road known to exist – exact course approximate';
    L.polyline(s.l, { renderer: itinerCanvas, color: '#b03a2e', weight: main ? 5 : 3, opacity: .9, dashArray: dash })
      .bindPopup('<div class="pop"><b>' + esc(s.n || 'Roman road') + '</b><br>' + esc(s.t || 'Road') + '<br>' + note +
                 '<br><small>Source: Itiner-e</small></div>')
      .addTo(itinerLayer);
    if (++drawn >= 1500) break;
  }
  return n;
}
function nearestRoman() {                       // closest dataset road to the centre of the screen
  if (!itiner) return null;
  const c = map.getCenter(), k = Math.cos(c.lat * Math.PI / 180); let best = null, bd = Infinity;
  for (const s of itiner) for (const p of s.l) {
    const dy = p[0] - c.lat, dx = (p[1] - c.lng) * k, d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = { p, s, dx, dy }; }
  }
  if (!best) return null;
  const dirs = ['east', 'north-east', 'north', 'north-west', 'west', 'south-west', 'south', 'south-east'];
  best.km = Math.sqrt(bd) * 111.2;
  best.dir = dirs[Math.round(Math.atan2(best.dy, best.dx) / (Math.PI / 4) + 8) % 8];
  return best;
}
function romanEmptyNote() {
  const nr = nearestRoman();
  return nr ? 'Roman roads on – none in this view. Nearest: ' + (nr.s.n || 'road') + ', ' + nr.km.toFixed(1) + ' km to the ' + nr.dir + '.'
            : 'Roman roads on – none recorded in this view.';
}
async function loadRoman(fromButton) {
  if (!romanOn || romanBusy) return;
  await loadItiner();
  let nIt = drawItiner();
  if (!nIt && fromButton) {                      // just switched on: widen the view to reach the nearest road
    const nr = nearestRoman();
    if (nr && nr.km < 40) {
      follow = false;
      map.fitBounds(L.latLngBounds([map.getCenter(), nr.p]).pad(.6), { maxZoom: map.getZoom() });
      nIt = drawItiner();
    }
  }
  if (nIt) $('status').textContent = nIt + ' Roman road section(s) – thick: main road, solid: located precisely, dashed: approximate course, dotted: assumed.';
  if (map.getZoom() < 10) { $('status').textContent = 'Zoom in to load Roman roads.'; return; }
  const b = map.getBounds();
  if (romanLoaded && romanLoaded.contains(b)) {
    if (!nIt) $('status').textContent = romanLayer.getLayers().length ? 'Roman roads on.' : romanEmptyNote();
    return;
  }
  const q = b.pad(.5), box = [q.getSouth(), q.getWest(), q.getNorth(), q.getEast()].map(n => n.toFixed(4)).join(',');
  const query = '[out:json][timeout:25];(' +
    'way["historic"="roman_road"](' + box + ');' +
    'relation["historic"="roman_road"](' + box + ');' +
    'way["roman_road"="yes"](' + box + ');' +
    'way["historic"="road"]["historic:civilization"~"roman",i](' + box + ');' +
    'way["highway"]["name"~"voie romaine|chaussée brunehaut|chaussee brunehaut|chaussée romaine|chemin des romains|chemin de césar|voie d.agrippa|via agrippa|via domitia|voie domitienne",i](' + box + ');' +
    ');out geom tags 800;';
  romanBusy = true; if (!nIt) $('status').textContent = 'Loading Roman roads…';
  const els = await fetchPlaces(query);
  romanBusy = false;
  if (!els) { if (!nIt) $('status').textContent = itiner ? romanEmptyNote() : 'Roman roads could not be loaded – check the connection and try again.'; return; }
  els.forEach(addRoman);
  romanLoaded = q;
  const n = romanLayer.getLayers().length;
  if (nIt) return;
  $('status').textContent = n ? n + ' Roman road section(s) – solid: recorded as Roman, dashed: by name only.' : romanEmptyNote();
}
$('roman').onclick = () => {
  romanOn = !romanOn; $('roman').classList.toggle('on', romanOn);
  if (romanOn) { romanLayer.addTo(map); itinerLayer.addTo(map); $('status').textContent = 'Loading Roman roads…'; loadRoman(true); }
  else { map.removeLayer(romanLayer); map.removeLayer(itinerLayer); $('status').textContent = 'Roman roads hidden.'; }
};
map.on('moveend', () => { clearTimeout(romanTimer); romanTimer = setTimeout(() => loadRoman(false), 800); });

/* ---------- Force the latest version (saved trips, finds and places are kept) ---------- */
$('update').onclick = async () => {
  $('status').textContent = 'Updating…';
  try {
    if (window.caches) for (const k of await caches.keys()) await caches.delete(k);
    if (navigator.serviceWorker) for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
  } catch (e) {}
  location.reload();
};

/* ---------- Install button (Chrome / Android) ---------- */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); installEvt = e; $('install').hidden = false;
});
$('install').onclick = async () => {
  if (!installEvt) return;
  installEvt.prompt(); await installEvt.userChoice;
  installEvt = null; $('install').hidden = true;
};
window.addEventListener('appinstalled', () => { $('install').hidden = true; });

/* ---------- Optional Google Maps base ---------- */
function loadScript(src) {
  return new Promise((ok, ko) => {
    const s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = ko; document.head.appendChild(s);
  });
}
async function enableGoogle(key) {
  try {
    await new Promise((ok, ko) => {
      window.__gmapsReady = ok;
      loadScript('https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key) +
                 '&callback=__gmapsReady&loading=async').catch(ko);
    });
    await loadScript('https://unpkg.com/leaflet.gridlayer.googlemutant@0.14.1/dist/Leaflet.GoogleMutant.js');
    bases['Google Maps'] = L.gridLayer.googleMutant({ type: 'roadmap', maxZoom: 19 });
    bases['Google satellite'] = L.gridLayer.googleMutant({ type: 'hybrid', maxZoom: 19 });
    refreshBaseList();
    setBase('Google Maps');
    if (cassini) cassini.bringToFront();
    store.set('gkey', key);
  } catch (e) {
    $('status').textContent = 'Could not load Google Maps – check the API key.';
  }
}
$('gload').onclick = () => { const k = $('gkey').value.trim(); if (k) enableGoogle(k); };
const saved = store.get('gkey');
if (saved) { $('gkey').value = saved; enableGoogle(saved); }
</script>
